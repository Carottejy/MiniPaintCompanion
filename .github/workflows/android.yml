name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: APK signé
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleGithubRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/github/release/app-github-release.apk MiniPaintCompanion-${VERSION_NAME}.apk

      - name: Erreurs de compilation (annotations)
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: MiniPaintCompanion-${{ env.VERSION_NAME }}
          path: MiniPaintCompanion-*.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v$VERSION_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION_NAME" MiniPaintCompanion-$VERSION_NAME.apk \
            --title "MiniPaintCompanion $VERSION_NAME" --latest \
            --notes "Télécharge MiniPaintCompanion-$VERSION_NAME.apk depuis ton téléphone Android et ouvre-le pour l'installer. Les mises à jour s'installent par-dessus la version précédente sans perdre tes réalisations ni ta collection."
